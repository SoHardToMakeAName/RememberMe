# .github/workflows/ci.yml
#
# RememberMe CI —— 不跑单元测试（tests/ 目录不入仓），只守住「能构建、能跑、能发布」这条链。
#
# 为什么要有这个：
#   1. src/mcp/build.ts 会自检 shebang —— 少了它，npm 生成的 bin shim 里
#      不会出现 node，装到用户机器上必然起不来（Windows 报「不是有效的
#      Win32 应用程序」，POSIX 报 exec format error）。
#   2. 产物必须能真的完成一次 JSON-RPC 握手，不能只是「文件生成了」。
#   3. npm pack 的内容必须和预期一致（bin / mcpName / 文件白名单）。
#
# 触发：推 main / 提 PR / 手动

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 + 冒烟测试 + 打包校验
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 装 Node（跑 dist 产物 + npm pack 用）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bunx tsc --noEmit

      - name: 构建 MCP 分发产物
        run: bun run build:mcp

      - name: 校验产物第一行是 shebang
        run: |
          head -1 dist/mcp/index.js | grep -qx '#!/usr/bin/env node' \
            || { echo "❌ 第一行不是 shebang —— npm 的 bin shim 不会调用 node"; head -1 dist/mcp/index.js; exit 1; }
          echo "✅ shebang 正常"

      - name: 冒烟测试：真的完成一次 JSON-RPC 握手
        env:
          REMEMBERME_DATA_DIR: ${{ runner.temp }}/rm-ci-data
          REMEMBERME_MCP_DISABLE_LLM: "1"
        run: |
          node --input-type=module -e '
          import { spawn } from "node:child_process";
          import { createInterface } from "node:readline";
          const child = spawn(process.execPath, ["dist/mcp/index.js"], {
            stdio: ["pipe", "pipe", "pipe"],
            env: { ...process.env },
          });
          const rl = createInterface({ input: child.stdout });
          const pending = new Map();
          let id = 0;
          let stderr = "";
          child.stderr.on("data", (d) => (stderr += d));
          rl.on("line", (l) => {
            const m = JSON.parse(l);
            if (pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); }
          });
          const rpc = (method, params) => new Promise((r) => {
            const i = ++id; pending.set(i, r);
            child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: i, method, params }) + "\n");
          });
          const init = await rpc("initialize", {
            protocolVersion: "2025-06-18", capabilities: {},
            clientInfo: { name: "ci", version: "0" },
          });
          if (init.result?.serverInfo?.name !== "rememberme") {
            console.error("❌ initialize 失败:", JSON.stringify(init).slice(0, 300));
            console.error(stderr);
            process.exit(1);
          }
          child.stdin.write(JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized" }) + "\n");
          const tools = await rpc("tools/list", {});
          const names = (tools.result?.tools ?? []).map((t) => t.name).sort();
          const want = ["list_memories", "read_memory", "read_profile", "record_turn"];
          if (JSON.stringify(names) !== JSON.stringify(want)) {
            console.error("❌ 工具集不对:", names.join(", "));
            process.exit(1);
          }
          // stdout 必须只有 JSON-RPC
          const res = await rpc("tools/call", { name: "list_memories", arguments: {} });
          if (res.result?.isError) {
            console.error("❌ list_memories 失败:", JSON.stringify(res).slice(0, 300));
            process.exit(1);
          }
          console.log("✅ 握手正常，4 个工具:", names.join(", "));
          child.kill();
          '

      - name: 校验 npm 包内容
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          # 不要硬编码版本号 —— 每次发版都要改这里，改漏了 CI 就红
          grep -qE 'jokab1074-rememberme-[0-9]+\.[0-9]+\.[0-9]+\.tgz' pack.txt || { echo "❌ 打包文件名不对"; exit 1; }
          grep -q 'dist/mcp/index.js' pack.txt || { echo "❌ 产物没进包"; exit 1; }
          # 不该出现在包里的东西
          if grep -qE 'package/(tests|scripts|experiments)/' pack.txt; then
            echo "❌ 包里混进了 tests/ scripts/ experiments/"; exit 1
          fi
          echo "✅ 打包内容正确"

      - name: 校验 server.json 与 package.json 一致
        run: |
          node -e '
          const pkg = require("./package.json");
          const srv = require("./server.json");
          const p = srv.packages[0];
          const checks = [
            ["name === packages[0].identifier", pkg.name === p.identifier],
            ["version 一致", pkg.version === srv.version && pkg.version === p.version],
            ["mcpName === server.json.name", pkg.mcpName === srv.name],
            ["publishConfig.access === public", pkg.publishConfig?.access === "public"],
          ];
          let ok = true;
          for (const [name, pass] of checks) {
            console.log((pass ? "✅" : "❌") + " " + name);
            if (!pass) ok = false;
          }
          process.exit(ok ? 0 : 1);
          '
